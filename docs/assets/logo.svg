<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Autopsy 中文版 标志">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B6BFF"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3B0764" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 盾牌主体 -->
  <path d="M256 36 L440 96 V264 C440 360 356 432 256 476 C156 432 72 360 72 264 V96 Z"
        fill="url(#shield)" filter="url(#soft)"/>

  <!-- 内侧描边，增加层次 -->
  <path d="M256 68 L408 118 V262 C408 340 340 400 256 436 C172 400 104 340 104 262 V118 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="7" stroke-linejoin="round"/>

  <!-- 三角形（居中、朝上） -->
  <path d="M256 158 L362 342 Q366 350 357 350 H155 Q146 350 150 342 Z"
        fill="url(#tri)"/>

  <!-- 三角内描边 -->
  <path d="M256 196 L330 326 Q332 330 327 330 H185 Q180 330 182 326 Z"
        fill="none" stroke="#7C3AED" stroke-opacity="0.35" stroke-width="6" stroke-linejoin="round"/>
</svg>
