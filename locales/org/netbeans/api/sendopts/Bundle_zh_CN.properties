# {0} - name of the option, like --help or -h
MSG_MissingArgument=\u9009\u9879 {0} \u9700\u8981\u4e00\u4e2a\u53c2\u6570

# {0} - name of already used option
# {1} - name of option used again
MSG_CannotTogether=\u9009\u9879 {0} \u4e0d\u80fd\u4e0e\u9009\u9879 {1} \u4e00\u8d77\u4f7f\u7528

# {0} - list of options separated by comma
MSG_NeedAtLeastOne=\u81f3\u5c11\u9700\u8981 {0} \u4e2d\u7684\u4e00\u4e2a

# {0} - list of options separated by comma
MSG_MissingOptions=\u8fd8\u9700\u8981\u540c\u65f6\u4f7f\u7528 {0}

# {0} - name of already used option
# {1} - name of option used again
MSG_NeedBoth=\u9009\u9879 {0} \u8fd8\u9700\u8981\u9009\u9879 {1}

MSG_Unknown=\u65e0\u6cd5\u8bc6\u522b\u7684\u9009\u9879 {0}

MSG_OneArg=<arg>
MSG_OptionalArg=[<arg>]
MSG_AddionalArgs=<arg1>...<argN>

MSG_OPTION_CANNOT_HAVE_VALUE=\u9009\u9879 {0} \u4e0d\u80fd\u6709\u503c {1}
